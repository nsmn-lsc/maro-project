<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="maroFavBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#064E3B" />
    </linearGradient>
    <linearGradient id="maroFavEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6EE7B7" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="maroFavMother" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A7F3D0" />
      <stop offset="60%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="favGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fondo redondeado con alto contraste -->
  <rect width="64" height="64" rx="16" fill="url(#maroFavBg)" />
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="#10B981" stroke-width="1.5" stroke-opacity="0.35" />

  <!-- Escudo Protector MARO -->
  <path
    d="M32 54 C17 47 10 35 10 19 L32 10 L54 19 C54 35 47 47 32 54 Z"
    fill="#10B981"
    fill-opacity="0.18"
    stroke="url(#maroFavEmerald)"
    stroke-width="2.5"
    stroke-linejoin="round"
  />

  <!-- Nodos de Vigilancia Clínica -->
  <circle cx="32" cy="8" r="2.5" fill="#6EE7B7" filter="url(#favGlow)" />
  <circle cx="55" cy="30" r="2.5" fill="#38BDF8" filter="url(#favGlow)" />
  <circle cx="32" cy="53" r="2.5" fill="#10B981" filter="url(#favGlow)" />
  <circle cx="9" cy="30" r="2.5" fill="#6EE7B7" filter="url(#favGlow)" />

  <!-- Silueta Materna Central -->
  <!-- Cabeza -->
  <circle cx="32" cy="20" r="3.5" fill="#A7F3D0" />

  <!-- Perfil / Cabello envolvente -->
  <path
    d="M29 17 C29 14 36 14 36.5 18 C37 21 31 23 30 26"
    stroke="#6EE7B7"
    stroke-width="1.6"
    stroke-linecap="round"
    fill="none"
  />

  <!-- Torso & Vientre Gestante -->
  <path
    d="M30.5 23 C27.5 26 26.5 30 27 34 C28 39 30.5 42 34 43.5 C37.5 45 40 43 40.5 39 C41 35 38 31 35 30 C33 29 32 26 30.5 23 Z"
    fill="url(#maroFavMother)"
  />

  <!-- Brazo protector -->
  <path
    d="M29.5 27 C26 30 26 35 29 39 C31 41 34.5 41.5 37 40.5"
    stroke="#E0F2FE"
    stroke-width="1.6"
    stroke-linecap="round"
    fill="none"
    opacity="0.95"
  />

  <!-- Núcleo de Vida Fetal -->
  <circle cx="34.5" cy="36.5" r="1.8" fill="#FFFFFF" filter="url(#favGlow)" />
</svg>
